<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - BarberShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">💈 BarberShop FlatOut</a>
            <a href="/" class="btn btn-outline-light btn-sm">← На главную</a>
        </div>
    </nav>

    <!-- Main -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">🔐 Вход в FlatOut</h4>
                    </div>
                    <div class="card-body p-4">
                        <!-- Табы -->
                        <ul class="nav nav-tabs mb-4" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="tab" 
                                        data-bs-target="#loginTab" type="button">
                                    Вход
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="tab" 
                                        data-bs-target="#registerTab" type="button">
                                    Регистрация клиента
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <!-- Таб: Вход -->
                            <div class="tab-pane fade show active" id="loginTab">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="loginEmail" 
                                               placeholder="email@example.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Пароль</label>
                                        <input type="password" class="form-control" id="loginPassword" 
                                               placeholder="••••••" required>
                                    </div>
                                    <button type="submit" class="btn btn-dark w-100">
                                        Войти
                                    </button>
                                </form>
                            </div>

                            <!-- Таб: Регистрация -->
                            <div class="tab-pane fade" id="registerTab">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label">Имя</label>
                                        <input type="text" class="form-control" id="regName" 
                                               placeholder="Иван Иванов" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="regEmail" 
                                               placeholder="email@example.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Телефон</label>
                                        <input type="tel" class="form-control" id="regPhone" 
                                               placeholder="+7 (999) 123-45-67" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Пароль</label>
                                        <input type="password" class="form-control" id="regPassword" 
                                               placeholder="••••••" required minlength="8">
                                        <small class="text-muted">Минимум 8 символов.</small>
                                    </div>
                                    <button type="submit" class="btn btn-dark w-100">
                                        Зарегистрироваться
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Сообщения -->
                        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                        <div id="successMessage" class="alert alert-success mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
